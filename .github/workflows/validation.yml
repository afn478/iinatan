name: Validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript, generated files, and packaging metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Check JavaScript formatting
        run: npx prettier --check "**/*.js"

      - name: Verify generated files and metadata
        run: python3 scripts/build_plugin.py --check-generated --validate

      - name: Run portable test groups
        run: node scripts/run_tests.js --exclude-group native
